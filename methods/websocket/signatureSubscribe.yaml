name: signatureSubscribe
status: standard
summary: Subscribe to the status of a transaction signature.
params:
  - name: signature
    required: true
    summary: Transaction signature to watch.
    schema: { $ref: '#/components/schemas/Signature' }
  - name: config
    required: false
    summary: Commitment and received-notification options.
    schema:
      type: object
      properties:
        commitment: { $ref: '#/components/schemas/Commitment' }
        enableReceivedNotification: { type: boolean }
result:
  name: subscriptionId
  summary: Identifier for this connection's subscription.
  schema: { $ref: '#/components/schemas/U64' }
errors:
  - $ref: '#/components/errors/InvalidParams'
  - $ref: '#/components/errors/InternalError'
examples:
  - name: basic
    summary: Create the subscription.
    params:
      - name: signature
        value: '5NfHk6JxqzQ54zk5cYBkiM7mj9XodPFdJNbB4z8zTETSV4gTWjSQm3yYAxT9Y7DkVMwq3siB1oX7nWdTUkzHd4Wq'
    result:
      name: subscriptionId
      value: 1
notification:
  name: signatureNotification
  description: Notification payload sent for this subscription.
  schema:
    type: object
    required: [subscription, result]
    properties:
      subscription: { $ref: '#/components/schemas/U64' }
      result:
        type: object
        required: [context, value]
        properties:
          context: { $ref: '#/components/schemas/RpcResponseContext' }
          value:
            oneOf:
              - type: object
                required: [err]
                properties:
                  err:
                    oneOf:
                      - $ref: '#/components/schemas/TransactionError'
                      - type: 'null'
              - type: string
                enum: [receivedSignature]
implementations:
  agave: { status: full }
  cloudbreak: { status: none }
  superbank: { status: none }
