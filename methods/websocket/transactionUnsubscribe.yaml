name: transactionUnsubscribe
status: standard
summary: Cancel a transactionSubscribe subscription.
params:
  - name: subscriptionId
    required: true
    summary: Identifier returned by transactionSubscribe on this connection.
    schema: { $ref: '#/components/schemas/U64' }
result:
  name: success
  summary: True when the subscription is cancelled.
  schema: { type: boolean }
errors:
  - $ref: '#/components/errors/InvalidParams'
examples:
  - name: basic
    summary: Cancel a transaction subscription.
    params:
      - name: subscriptionId
        value: 1
    result:
      name: success
      value: true
implementations:
  agave: { status: none }
  cloudbreak: { status: none }
  richat: { status: full, notes: "disabled by default; enable_transaction_subscription must be set" }
  superbank: { status: none }
