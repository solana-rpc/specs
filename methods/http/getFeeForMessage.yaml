name: getFeeForMessage
status: standard
summary: Returns the fee for a base64 serialized transaction message.
params:
  - name: message
    required: true
    summary: Base64 encoded serialized versioned message, not a full transaction.
    schema: { type: string, minLength: 1 }
  - name: config
    required: false
    summary: Commitment and minimum context slot.
    schema:
      type: object
      properties:
        commitment: { $ref: '#/components/schemas/Commitment' }
        minContextSlot: { $ref: '#/components/schemas/Slot' }
result:
  name: fee
  summary: Fee in lamports, or null when the message cannot be priced in the selected bank.
  schema:
    type: object
    required: [context, value]
    properties:
      context: { $ref: '#/components/schemas/RpcResponseContext' }
      value:
        oneOf:
          - { $ref: '#/components/schemas/U64' }
          - { type: 'null' }
errors:
  - $ref: '#/components/errors/InvalidParams'
  - $ref: '#/components/errors/MinContextSlotNotReached'
examples:
  - name: absent-fee
    summary: Return null when the selected bank cannot price the message.
    params:
      - name: message
        value: "AQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABAAEDAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=="
    result:
      name: fee
      value: { context: { slot: 123, apiVersion: "3.0.0" }, value: null }
implementations:
  agave: { status: full }
  cloudbreak: { status: none }
  superbank: { status: none }
