name: getMinimumBalanceForRentExemption
status: standard
summary: Returns the minimum lamports required for rent exemption.
params:
  - name: dataLen
    required: true
    summary: Account data length in bytes.
    schema: { $ref: '#/components/schemas/U64' }
  - name: commitment
    required: false
    summary: Commitment level.
    schema: { $ref: '#/components/schemas/Commitment' }
result:
  name: lamports
  summary: Minimum rent-exempt balance in lamports.
  schema: { $ref: '#/components/schemas/U64' }
errors:
  - $ref: '#/components/errors/InvalidRequest'
examples:
  - name: token-account
    summary: Rent-exempt balance for 165 bytes.
    params:
      - name: dataLen
        value: 165
    result:
      name: lamports
      value: 2039280
implementations:
  agave: { status: full }
  cloudbreak: { status: none }
  superbank: { status: none }
