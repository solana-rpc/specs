name: getTokenAccountsByMint
status: standard
summary: Returns token accounts for one mint.
params:
  - name: mint
    required: true
    summary: Mint address stored in the first 32 bytes of each matching account.
    schema: { $ref: '#/components/schemas/Pubkey' }
  - name: config
    required: false
    summary: Account and token-program configuration.
    schema:
      type: object
      properties:
        commitment: { $ref: '#/components/schemas/CommitmentConfirmedFinalized' }
        encoding: { $ref: '#/components/schemas/AccountEncoding' }
        dataSlice: { $ref: '#/components/schemas/DataSlice' }
        minContextSlot: { $ref: '#/components/schemas/Slot' }
        programId:
          allOf:
            - $ref: '#/components/schemas/Pubkey'
          description: Account owner program. Defaults to the legacy SPL Token program.
result:
  name: tokenAccounts
  summary: Matching accounts, in an RpcResponse envelope.
  schema:
    type: object
    required: [context, value]
    properties:
      context: { $ref: '#/components/schemas/RpcResponseContext' }
      value:
        type: array
        items: { $ref: '#/components/schemas/RpcKeyedAccount' }
errors:
  - $ref: '#/components/errors/MinContextSlotNotReached'
  - $ref: '#/components/errors/KeyExcludedFromSecondaryIndex'
  - $ref: '#/components/errors/ScanError'
  - $ref: '#/components/errors/InvalidParams'
  - $ref: '#/components/errors/InvalidRequest'
examples:
  - name: token-2022
    summary: Token-2022 accounts for one mint.
    params:
      - name: mint
        value: "Gh9ZwEmdLJ8DscKNTkTqPbNwLNNBjuSzaG9Vp2KGtKJr"
      - name: config
        value:
          programId: "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb"
          encoding: base64
          commitment: finalized
    result:
      name: tokenAccounts
      value:
        context: { slot: 250000123, apiVersion: "2.3.0" }
        value: []
implementations:
  agave: { status: none }
  cloudbreak: { status: partial, notes: "shipped extension; streamed response can truncate if a database error occurs after output starts" }
  superbank: { status: none }
