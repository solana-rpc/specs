name: getAccountInfo
status: standard
summary: Returns all information associated with the account at the given address.
params:
  - name: pubkey
    required: true
    summary: Address of the account to query.
    schema: { $ref: '#/components/schemas/Pubkey' }
  - name: config
    required: false
    summary: Configuration object.
    schema:
      type: object
      properties:
        commitment: { $ref: '#/components/schemas/Commitment' }
        encoding: { $ref: '#/components/schemas/AccountEncoding' }
        dataSlice: { $ref: '#/components/schemas/DataSlice' }
        minContextSlot: { $ref: '#/components/schemas/Slot' }
result:
  name: accountInfo
  summary: The account, or `null`, in an RpcResponse envelope.
  schema:
    type: object
    required: [context, value]
    properties:
      context: { $ref: '#/components/schemas/RpcResponseContext' }
      value:
        oneOf:
          - $ref: '#/components/schemas/UiAccount'
          - type: 'null'
            description: The account does not exist.
errors:
  - $ref: '#/components/errors/MinContextSlotNotReached'
  - $ref: '#/components/errors/InvalidParams'
  - $ref: '#/components/errors/InvalidRequest'
examples:
  - name: base58Encoded
    summary: An existing account requested with `base58` encoding.
    params:
      - name: pubkey
        value: "vines1vzrYbzLMRdu58ou5XTby4qAqVRLmqo36NKPTg"
      - name: config
        value: { encoding: base58 }
    result:
      name: accountInfo
      value:
        context: { slot: 100, apiVersion: "2.3.0" }
        value:
          lamports: 1000000000
          data: ["11116bv5nS2h3y12kD1yUKeMZvGcKLSjQgX6BeV7u1FrjeJcKfsHPXHRDEHrBesJhZyqnnq9qJeUuF7WHxiuLuL5twc38w2TXNLxnDbjmuR", base58]
          owner: "11111111111111111111111111111111"
          executable: false
          rentEpoch: 18446744073709551615
          space: 80
  - name: missingAccount
    summary: "An account that does not exist returns `value: null`, not an error."
    params:
      - name: pubkey
        value: "5oNDL3swdJJF1g9DzJiZ4ynHXgszjAEpUkxVYejchzrY"
    result:
      name: accountInfo
      value:
        context: { slot: 100 }
        value: null
implementations:
  agave: { status: full }
  cloudbreak: { status: partial, notes: "processed rejected/downgraded; default encoding binary (base58)" }
  superbank: { status: none }

category: Accounts
tests:
  - name: encoding
    params:
      - $fixture: account
      - encoding:
          $matrix: encoding
    expect:
      available:
        type: object
        required:
          - value
        properties:
          value:
            not:
              type: "null"
      result:
        type: object
        required:
          - value
        properties:
          value:
            type: object
            required:
              - data
            properties:
              data:
                type: array
                items:
                  - type: string
                  - const:
                      $matrix: encoding
                minItems: 2
                maxItems: 2
    matrix:
      encoding:
        - base58
        - base64
        - base64+zstd
  - name: encoding-binary
    params:
      - $fixture: account
      - encoding: binary
    expect:
      available:
        type: object
        required:
          - value
        properties:
          value:
            not:
              type: "null"
      result:
        type: object
        required:
          - value
        properties:
          value:
            type: object
            required:
              - data
            properties:
              data:
                type: string
  - name: encoding-jsonParsed
    params:
      - $fixture: account
      - encoding: jsonParsed
    expect:
      available:
        type: object
        required:
          - value
        properties:
          value:
            not:
              type: "null"
      result:
        type: object
        required:
          - value
        properties:
          value:
            type: object
            required:
              - data
            properties:
              data:
                oneOf:
                  - type: object
                  - type: array
                    items:
                      - type: string
                      - const: base64
                    minItems: 2
                    maxItems: 2
  - name: default-encoding
    params:
      - $fixture: account
    expect:
      available:
        type: object
        required:
          - value
        properties:
          value:
            not:
              type: "null"
      result:
        type: object
        required:
          - value
        properties:
          value:
            type: object
            required:
              - data
            properties:
              data:
                type: string
  - name: data-slice
    params:
      - $fixture: account
      - encoding: base64
        dataSlice:
          offset: 0
          length: 0
    expect:
      available:
        type: object
        required:
          - value
        properties:
          value:
            not:
              type: "null"
      result:
        type: object
        required:
          - value
        properties:
          value:
            type: object
            required:
              - data
            properties:
              data:
                const:
                  - ""
                  - base64
  - name: missing-account
    params:
      - $fixture: missingAccount
    expect:
      result:
        type: object
        required:
          - value
        properties:
          value:
            type: "null"
  - name: missing-required-params
    params: []
    expect:
      error: InvalidParams
  - name: invalid-base58
    params:
      - not-a-base58-key!
      - encoding: base64
    expect:
      error: InvalidParams
  - name: min-context-slot
    params:
      - $fixture: account
      - encoding: base64
        minContextSlot:
          $fixture: futureSlot
    expect:
      error: MinContextSlotNotReached
      message: Minimum context slot has not been reached
