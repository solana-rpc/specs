name: getBlock
status: standard
summary: Returns identity and transaction information about a confirmed block.
params:
  - name: slot
    required: true
    summary: Slot of the block to fetch.
    schema: { $ref: '#/components/schemas/Slot' }
  - name: config
    required: false
    summary: Configuration object, or a bare encoding string (deprecated).
    schema:
      oneOf:
        - title: Config
          type: object
          properties:
            commitment: { $ref: '#/components/schemas/CommitmentConfirmedFinalized' }
            encoding: { $ref: '#/components/schemas/TransactionEncoding' }
            transactionDetails:
              type: string
              enum: [full, accounts, signatures, none]
              description: Level of transaction detail to return. Default `full`.
            maxSupportedTransactionVersion:
              description: >-
                Highest transaction version the caller can decode. Omitting
                it means only legacy transactions are acceptable.
              allOf:
                - $ref: '#/components/schemas/U8'
            rewards:
              type: boolean
              description: Whether to populate the rewards array. Default true.
        - title: DeprecatedEncoding
          description: >-
            A bare encoding string in place of the config object. Accepted by
            the reference implementation for backwards compatibility; new
            clients MUST send the object form.
          allOf:
            - $ref: '#/components/schemas/TransactionEncoding'
result:
  name: block
  summary: The block, or null when the node has no block for the slot to report.
  schema:
    oneOf:
      - $ref: '#/components/schemas/UiConfirmedBlock'
      - type: 'null'
        description: >-
          The node could not produce a block for the slot and did not
          classify the reason as one of the block errors below.
errors:
  - $ref: '#/components/errors/BlockNotAvailable'
  - $ref: '#/components/errors/BlockStatusNotAvailableYet'
  - $ref: '#/components/errors/SlotSkipped'
  - $ref: '#/components/errors/LongTermStorageSlotSkipped'
  - $ref: '#/components/errors/BlockCleanedUp'
  - $ref: '#/components/errors/UnsupportedTransactionVersion'
  - $ref: '#/components/errors/TransactionHistoryNotAvailable'
  - $ref: '#/components/errors/InvalidParams'
examples:
  - name: signaturesOnly
    summary: "`transactionDetails: signatures` with rewards suppressed."
    params:
      - name: slot
        value: 430
      - name: config
        value: { encoding: json, transactionDetails: signatures, rewards: false, maxSupportedTransactionVersion: 0 }
    result:
      name: block
      value:
        blockhash: "3Eq21vXNB5s86c62bVuUfTeaMif1N2kUqRPBmGRJhyTA"
        previousBlockhash: "mfcyqEXB3DnHXki6KjjmZck6YjmZLvpAByy2fj4nh6B"
        parentSlot: 429
        blockTime: null
        blockHeight: 428
        signatures:
          - "5nn4nQXXHRNCLzq8x2wR9tTn3GfnLiGf2ZFsAxvZUAMzhPnwzUxqzL9zeVQ1EFiXPSCE9HuVKZHs4kHzmmr3JTx"
  - name: rewardsOnly
    summary: "`transactionDetails: none` keeps the rewards array and drops both transaction members."
    params:
      - name: slot
        value: 430
      - name: config
        value: { transactionDetails: none, maxSupportedTransactionVersion: 0 }
    result:
      name: block
      value:
        blockhash: "3Eq21vXNB5s86c62bVuUfTeaMif1N2kUqRPBmGRJhyTA"
        previousBlockhash: "mfcyqEXB3DnHXki6KjjmZck6YjmZLvpAByy2fj4nh6B"
        parentSlot: 429
        blockTime: 1655374970
        blockHeight: 428
        rewards:
          - pubkey: "6dmNQ5jwLeLk5REvio1JcMshcbvkYMwy26sJ8pbkvStu"
            lamports: -14
            postBalance: 499999932500
            rewardType: Rent
            commission: null
implementations:
  agave: { status: full }
  cloudbreak: { status: none }
  superbank: { status: partial, notes: "strict unknown-config-field rejection; processed n/a; served from ClickHouse" }

category: Ledger
tests:
  - name: details-none-rewards-true
    params:
      - $fixture: slot
      - transactionDetails: none
        rewards: true
        maxSupportedTransactionVersion: 0
    expect:
      available:
        not:
          type: "null"
      result:
        allOf:
          - required:
              - rewards
          - not:
              required:
                - transactions
          - not:
              required:
                - signatures
  - name: details-none-rewards-false
    params:
      - $fixture: slot
      - transactionDetails: none
        rewards: false
        maxSupportedTransactionVersion: 0
    expect:
      available:
        not:
          type: "null"
      result:
        allOf:
          - not:
              required:
                - rewards
          - not:
              required:
                - transactions
          - not:
              required:
                - signatures
  - name: details-signatures-rewards-true
    params:
      - $fixture: slot
      - transactionDetails: signatures
        rewards: true
        maxSupportedTransactionVersion: 0
    expect:
      available:
        not:
          type: "null"
      result:
        allOf:
          - required:
              - rewards
          - not:
              required:
                - transactions
          - required:
              - signatures
  - name: details-signatures-rewards-false
    params:
      - $fixture: slot
      - transactionDetails: signatures
        rewards: false
        maxSupportedTransactionVersion: 0
    expect:
      available:
        not:
          type: "null"
      result:
        allOf:
          - not:
              required:
                - rewards
          - not:
              required:
                - transactions
          - required:
              - signatures
  - name: details-accounts-rewards-true
    params:
      - $fixture: slot
      - transactionDetails: accounts
        rewards: true
        maxSupportedTransactionVersion: 0
    expect:
      available:
        not:
          type: "null"
      result:
        allOf:
          - required:
              - rewards
          - required:
              - transactions
          - not:
              required:
                - signatures
          - properties:
              transactions:
                type: array
                items:
                  type: object
                  required:
                    - transaction
                  properties:
                    transaction:
                      not:
                        required:
                          - message
  - name: details-accounts-rewards-false
    params:
      - $fixture: slot
      - transactionDetails: accounts
        rewards: false
        maxSupportedTransactionVersion: 0
    expect:
      available:
        not:
          type: "null"
      result:
        allOf:
          - not:
              required:
                - rewards
          - required:
              - transactions
          - not:
              required:
                - signatures
          - properties:
              transactions:
                type: array
                items:
                  type: object
                  required:
                    - transaction
                  properties:
                    transaction:
                      not:
                        required:
                          - message
  - name: details-full-rewards-true
    params:
      - $fixture: slot
      - transactionDetails: full
        rewards: true
        maxSupportedTransactionVersion: 0
    expect:
      available:
        not:
          type: "null"
      result:
        allOf:
          - required:
              - rewards
          - required:
              - transactions
          - not:
              required:
                - signatures
  - name: details-full-rewards-false
    params:
      - $fixture: slot
      - transactionDetails: full
        rewards: false
        maxSupportedTransactionVersion: 0
    expect:
      available:
        not:
          type: "null"
      result:
        allOf:
          - not:
              required:
                - rewards
          - required:
              - transactions
          - not:
              required:
                - signatures
  - name: encoding-base64
    params:
      - $fixture: slot
      - encoding: base64
        rewards: false
        maxSupportedTransactionVersion: 0
    expect:
      available:
        type: object
        required:
          - transactions
        properties:
          transactions:
            minItems: 1
      result:
        type: object
        required:
          - transactions
        properties:
          transactions:
            type: array
            items:
              type: object
              required:
                - transaction
              properties:
                transaction:
                  type: array
                  items:
                    - type: string
                    - const: base64
                  minItems: 2
                  maxItems: 2
  - name: encoding-base58
    params:
      - $fixture: slot
      - encoding: base58
        rewards: false
        maxSupportedTransactionVersion: 0
    expect:
      available:
        type: object
        required:
          - transactions
        properties:
          transactions:
            minItems: 1
      result:
        type: object
        required:
          - transactions
        properties:
          transactions:
            type: array
            items:
              type: object
              required:
                - transaction
              properties:
                transaction:
                  type: array
                  items:
                    - type: string
                    - const: base58
                  minItems: 2
                  maxItems: 2
  - name: encoding-jsonParsed
    params:
      - $fixture: slot
      - encoding: jsonParsed
        rewards: false
        maxSupportedTransactionVersion: 0
    expect:
      available:
        type: object
        required:
          - transactions
        properties:
          transactions:
            minItems: 1
      result:
        type: object
        required:
          - transactions
        properties:
          transactions:
            type: array
            items:
              type: object
              required:
                - transaction
              properties:
                transaction:
                  type: object
                  required:
                    - message
                  properties:
                    message:
                      type: object
                      required:
                        - accountKeys
                      properties:
                        accountKeys:
                          type: array
                          items:
                            type: object
                meta:
                  anyOf:
                    - type: "null"
                    - not:
                        required:
                          - loadedAddresses
  - name: processed-rejected
    params:
      - $fixture: slot
        default: 0
      - commitment: processed
    expect:
      error: InvalidParams
  - name: missing-required-params
    params: []
    expect:
      error: InvalidParams
