name: getMultipleAccounts
status: standard
summary: Returns account information for a list of addresses.
params:
  - name: pubkeys
    required: true
    summary: Addresses of the accounts to query, at most 100.
    schema:
      type: array
      maxItems: 100
      items: { $ref: '#/components/schemas/Pubkey' }
  - name: config
    required: false
    summary: Configuration object.
    schema:
      type: object
      properties:
        commitment: { $ref: '#/components/schemas/Commitment' }
        encoding: { $ref: '#/components/schemas/AccountEncoding' }
        dataSlice: { $ref: '#/components/schemas/DataSlice' }
        minContextSlot: { $ref: '#/components/schemas/Slot' }
result:
  name: accounts
  summary: One entry per requested address, in request order, in an RpcResponse envelope.
  schema:
    type: object
    required: [context, value]
    properties:
      context: { $ref: '#/components/schemas/RpcResponseContext' }
      value:
        type: array
        items:
          oneOf:
            - $ref: '#/components/schemas/UiAccount'
            - type: 'null'
              description: The account at the corresponding request index does not exist.
errors:
  - $ref: '#/components/errors/MinContextSlotNotReached'
  - $ref: '#/components/errors/InvalidParams'
  - $ref: '#/components/errors/InvalidRequest'
examples:
  - name: twoAccountsOneMissing
    summary: Two addresses; the second account does not exist and comes back as `null`.
    params:
      - name: pubkeys
        value:
          - "vines1vzrYbzLMRdu58ou5XTby4qAqVRLmqo36NKPTg"
          - "5oNDL3swdJJF1g9DzJiZ4ynHXgszjAEpUkxVYejchzrY"
      - name: config
        value: { encoding: base64 }
    result:
      name: accounts
      value:
        context: { slot: 100, apiVersion: "2.3.0" }
        value:
          - lamports: 1000000000
            data: ["AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=", base64]
            owner: "11111111111111111111111111111111"
            executable: false
            rentEpoch: 18446744073709551615
            space: 80
          - null
implementations:
  agave: { status: full }
  cloudbreak: { status: partial, notes: "cap configurable via max-multiple-accounts (default 100); default encoding base64" }
  superbank: { status: none }

category: Accounts
tests:
  - name: order-duplicates-and-null
    params:
      - - $fixture: account
        - $fixture: missingAccount
        - $fixture: account
    expect:
      shape:
        type: object
        required:
          - value
        properties:
          value:
            type: array
            minItems: 3
            maxItems: 3
            items:
              - true
              - type: "null"
              - true
      available:
        type: object
        required:
          - value
        properties:
          value:
            items:
              - not:
                  type: "null"
      assertions:
        - path: /value/0
          equalsPath: /value/2
  - name: encoding-base64
    params:
      - - $fixture: account
      - encoding: base64
    expect:
      available:
        type: object
        required:
          - value
        properties:
          value:
            minItems: 1
            items:
              - not:
                  type: "null"
      result:
        type: object
        required:
          - value
        properties:
          value:
            type: array
            items:
              type: object
              required:
                - data
              properties:
                data:
                  type: array
                  items:
                    - type: string
                    - const: base64
                  minItems: 2
                  maxItems: 2
  - name: encoding-base58
    params:
      - - $fixture: account
      - encoding: base58
    expect:
      available:
        type: object
        required:
          - value
        properties:
          value:
            minItems: 1
            items:
              - not:
                  type: "null"
      result:
        type: object
        required:
          - value
        properties:
          value:
            type: array
            items:
              type: object
              required:
                - data
              properties:
                data:
                  type: array
                  items:
                    - type: string
                    - const: base58
                  minItems: 2
                  maxItems: 2
  - name: encoding-jsonParsed
    params:
      - - $fixture: account
      - encoding: jsonParsed
    expect:
      available:
        type: object
        required:
          - value
        properties:
          value:
            minItems: 1
            items:
              - not:
                  type: "null"
      result:
        type: object
        required:
          - value
        properties:
          value:
            type: array
            items:
              type: object
              required:
                - data
              properties:
                data:
                  oneOf:
                    - type: object
                    - type: array
                      items:
                        - type: string
                        - const: base64
                      minItems: 2
                      maxItems: 2
  - name: default-encoding
    params:
      - - $fixture: account
    expect:
      available:
        type: object
        required:
          - value
        properties:
          value:
            minItems: 1
            items:
              - not:
                  type: "null"
      result:
        type: object
        required:
          - value
        properties:
          value:
            type: array
            items:
              type: object
              required:
                - data
              properties:
                data:
                  type: array
                  items:
                    - type: string
                    - const: base64
                  minItems: 2
                  maxItems: 2
  - name: empty-list
    params:
      - []
    expect:
      result:
        type: object
        required:
          - value
        properties:
          value:
            maxItems: 0
  - name: missing-required-params
    params: []
    expect:
      error: InvalidParams
  - name: min-context-slot
    params:
      - - $fixture: account
        - $fixture: missingAccount
        - $fixture: account
      - minContextSlot:
          $fixture: futureSlot
    expect:
      error: MinContextSlotNotReached
      message: Minimum context slot has not been reached
