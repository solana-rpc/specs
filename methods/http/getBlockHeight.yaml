name: getBlockHeight
status: standard
summary: Returns the current block height at the given or default commitment level.
params:
  - name: config
    required: false
    summary: Configuration object.
    schema:
      type: object
      properties:
        commitment: { $ref: '#/components/schemas/Commitment' }
        minContextSlot: { $ref: '#/components/schemas/Slot' }
result:
  name: blockHeight
  summary: Current block height. Bare integer, no context envelope.
  schema: { $ref: '#/components/schemas/U64' }
errors:
  - $ref: '#/components/errors/MinContextSlotNotReached'
examples:
  - name: basic
    summary: Default (`finalized`) commitment.
    params: []
    result:
      name: blockHeight
      value: 1233
  - name: confirmed-commitment
    summary: Block height at `confirmed`.
    params:
      - name: config
        value: { commitment: confirmed }
    result:
      name: blockHeight
      value: 1235
implementations:
  agave: { status: full }
  cloudbreak: { status: none }
  superbank: { status: partial, notes: "processed requires grpc-head-cache; derived from stored blocks" }
