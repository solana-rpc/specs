name: getTokenSupply
status: standard
summary: Returns the current supply of an SPL Token mint.
params:
  - name: mint
    required: true
    summary: Address of the token mint.
    schema: { $ref: '#/components/schemas/Pubkey' }
  - name: config
    required: false
    summary: Configuration object.
    schema:
      type: object
      properties:
        commitment: { $ref: '#/components/schemas/Commitment' }
result:
  name: tokenSupply
  summary: Token supply, in an RpcResponse envelope.
  schema:
    type: object
    required: [context, value]
    properties:
      context: { $ref: '#/components/schemas/RpcResponseContext' }
      value:
        type: object
        required: [amount, decimals, uiAmount, uiAmountString]
        properties:
          amount: { type: string, pattern: '^[0-9]+$' }
          decimals: { $ref: '#/components/schemas/U8' }
          uiAmount:
            oneOf:
              - type: number
              - type: 'null'
          uiAmountString: { type: string }
errors:
  - $ref: '#/components/errors/InvalidParams'
examples:
  - name: supply
    summary: Supply of a mint with two decimals.
    params:
      - name: mint
        value: "Gh9ZwEmdLJ8DscKNTkTqPbNwLNNBjuSzaG9Vp2KGtKJr"
      - name: config
        value: { commitment: finalized }
    result:
      name: tokenSupply
      value:
        context: { slot: 1114, apiVersion: "2.3.0" }
        value: { amount: "100000", decimals: 2, uiAmount: 1000, uiAmountString: "1000" }
implementations:
  agave: { status: full }
  cloudbreak: { status: partial, notes: "SPL Token and Token-2022 supported; processed rejected or downgraded; missing or excluded mint data uses Cloudbreak-specific errors" }
  superbank: { status: none }
