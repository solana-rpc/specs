name: getTokenAccountsByDelegate
status: standard
summary: Returns SPL Token accounts delegated to the given address.
params:
  - name: delegate
    required: true
    summary: Address of the approved delegate.
    schema: { $ref: '#/components/schemas/Pubkey' }
  - name: filter
    required: true
    summary: Exactly one of `{ mint }` or `{ programId }`.
    schema: { $ref: '#/components/schemas/TokenAccountsFilter' }
  - name: config
    required: false
    summary: Configuration object.
    schema:
      type: object
      properties:
        commitment: { $ref: '#/components/schemas/Commitment' }
        encoding: { $ref: '#/components/schemas/AccountEncoding' }
        dataSlice: { $ref: '#/components/schemas/DataSlice' }
        minContextSlot: { $ref: '#/components/schemas/Slot' }
result:
  name: tokenAccounts
  summary: Matching token accounts, in an RpcResponse envelope.
  schema:
    type: object
    required: [context, value]
    properties:
      context: { $ref: '#/components/schemas/RpcResponseContext' }
      value:
        type: array
        items: { $ref: '#/components/schemas/RpcKeyedAccount' }
errors:
  - $ref: '#/components/errors/MinContextSlotNotReached'
  - $ref: '#/components/errors/KeyExcludedFromSecondaryIndex'
  - $ref: '#/components/errors/ScanError'
  - $ref: '#/components/errors/InvalidParams'
  - $ref: '#/components/errors/InvalidRequest'
examples:
  - name: no-delegated-accounts
    summary: A delegate with no matching accounts returns an empty array.
    params:
      - name: delegate
        value: "9mMBg1qaUaQdht6Q7r5T5VirRzJbNAyquKTq96FyR4UC"
      - name: filter
        value: { mint: "Gh9ZwEmdLJ8DscKNTkTqPbNwLNNBjuSzaG9Vp2KGtKJr" }
      - name: config
        value: { encoding: jsonParsed, commitment: finalized }
    result:
      name: tokenAccounts
      value:
        context: { slot: 1114, apiVersion: "2.3.0" }
        value: []
implementations:
  agave: { status: full }
  cloudbreak: { status: partial, notes: "SPL Token and Token-2022 supported; processed rejected or downgraded; ordering varies by query path" }
  superbank: { status: none }
