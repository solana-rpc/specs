name: getTokenAccountsByOwner
status: standard
summary: Returns all SPL Token accounts owned by the given address.
params:
  - name: owner
    required: true
    summary: Address of the token account owner.
    schema: { $ref: '#/components/schemas/Pubkey' }
  - name: filter
    required: true
    summary: Exactly one of `{ mint }` or `{ programId }`.
    schema: { $ref: '#/components/schemas/TokenAccountsFilter' }
  - name: config
    required: false
    summary: Configuration object.
    schema:
      type: object
      properties:
        commitment: { $ref: '#/components/schemas/Commitment' }
        encoding: { $ref: '#/components/schemas/AccountEncoding' }
        dataSlice: { $ref: '#/components/schemas/DataSlice' }
        minContextSlot: { $ref: '#/components/schemas/Slot' }
result:
  name: tokenAccounts
  summary: Matching token accounts, in an RpcResponse envelope.
  schema:
    type: object
    required: [context, value]
    properties:
      context: { $ref: '#/components/schemas/RpcResponseContext' }
      value:
        type: array
        items: { $ref: '#/components/schemas/RpcKeyedAccount' }
errors:
  - $ref: '#/components/errors/MinContextSlotNotReached'
  - $ref: '#/components/errors/KeyExcludedFromSecondaryIndex'
  - $ref: '#/components/errors/ScanError'
  - $ref: '#/components/errors/InvalidParams'
  - $ref: '#/components/errors/InvalidRequest'
examples:
  - name: byProgramId
    summary: All SPL Token accounts of an owner, `jsonParsed`.
    params:
      - name: owner
        value: "A1TMhSGzQxMr1TboBKtgixKz1sS6REASMxPo1qsyTSJd"
      - name: filter
        value: { programId: "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA" }
      - name: config
        value: { encoding: jsonParsed }
    result:
      name: tokenAccounts
      value:
        context: { slot: 1114 }
        value:
          - pubkey: "C2gJg6tKpQs41PRS1nC8aw3ZKNZK3HQQZGVrDFDup5nx"
            account:
              lamports: 1726080
              data:
                program: spl-token
                parsed:
                  info:
                    tokenAmount:
                      amount: "1"
                      decimals: 1
                      uiAmount: 0.1
                      uiAmountString: "0.1"
                    delegate: "4Nd1mBQtrMJVYVfKf2PJy9NZUZdTAsp7D4xWLs4gDB4T"
                    delegatedAmount:
                      amount: "1"
                      decimals: 1
                      uiAmount: 0.1
                      uiAmountString: "0.1"
                    state: initialized
                    isNative: false
                    mint: "3wyAj7Rt1TWvPZVadmJdGmmT94Vk8ovVmqgyaeUcPjKF"
                    owner: "4Nd1mBQtrMJVYVfKf2PJy9NZUZdTAsp7D4xWLs4gDB4T"
                  type: account
                space: 165
              owner: "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"
              executable: false
              rentEpoch: 4
              space: 165
  - name: byMintNoAccounts
    summary: An owner with no accounts for the given mint returns an empty array.
    params:
      - name: owner
        value: "A1TMhSGzQxMr1TboBKtgixKz1sS6REASMxPo1qsyTSJd"
      - name: filter
        value: { mint: "3wyAj7Rt1TWvPZVadmJdGmmT94Vk8ovVmqgyaeUcPjKF" }
      - name: config
        value: { encoding: jsonParsed, commitment: confirmed }
    result:
      name: tokenAccounts
      value:
        context: { slot: 250000123, apiVersion: "2.3.0" }
        value: []
implementations:
  agave: { status: full }
  cloudbreak: { status: partial, notes: "delegate byte-layout matching supports legacy SPL Token only for ByDelegate; programId filter restricted to SPL Token / Token-2022" }
  superbank: { status: none }

category: Tokens
tests:
  - name: empty-owner
    params:
      - $fixture: missingAccount
      - programId:
          $fixture: tokenProgram
      - encoding: base64
    expect:
      result:
        type: object
        required:
          - value
        properties:
          value:
            maxItems: 0
  - name: owner-by-programId
    params:
      - $fixture: tokenOwner
      - programId:
          $fixture: tokenProgram
      - encoding: jsonParsed
    expect:
      available:
        type: object
        required:
          - value
        properties:
          value:
            minItems: 1
      result:
        type: object
        required:
          - value
        properties:
          value:
            type: array
            items:
              type: object
              required:
                - account
              properties:
                account:
                  type: object
                  required:
                    - data
                  properties:
                    data:
                      type: object
                      required:
                        - parsed
                      properties:
                        parsed:
                          type: object
                          required:
                            - info
                          properties:
                            info:
                              type: object
                              required:
                                - owner
                              properties:
                                owner:
                                  const:
                                    $fixture: tokenOwner
  - name: owner-by-mint
    params:
      - $fixture: tokenOwner
      - mint:
          $fixture: tokenMint
      - encoding: jsonParsed
    expect:
      available:
        type: object
        required:
          - value
        properties:
          value:
            minItems: 1
      result:
        type: object
        required:
          - value
        properties:
          value:
            type: array
            items:
              type: object
              required:
                - account
              properties:
                account:
                  type: object
                  required:
                    - data
                  properties:
                    data:
                      type: object
                      required:
                        - parsed
                      properties:
                        parsed:
                          type: object
                          required:
                            - info
                          properties:
                            info:
                              type: object
                              required:
                                - owner
                                - mint
                              properties:
                                owner:
                                  const:
                                    $fixture: tokenOwner
                                mint:
                                  const:
                                    $fixture: tokenMint
  - name: invalid-token-program
    params:
      - $fixture: missingAccount
      - programId:
          $fixture: account
    expect:
      error: InvalidParams
  - name: ambiguous-filter
    params:
      - $fixture: missingAccount
      - mint:
          $fixture: nativeMint
        programId:
          $fixture: tokenProgram
    expect:
      error: InvalidParams
  - name: empty-filter
    params:
      - $fixture: missingAccount
      - {}
    expect:
      error: InvalidParams
  - name: missing-required-params
    params: []
    expect:
      error: InvalidParams
  - name: invalid-base58
    params:
      - not-a-base58-key!
      - programId:
          $fixture: tokenProgram
      - encoding: base64
    expect:
      error: InvalidParams
  - name: min-context-slot
    params:
      - $fixture: missingAccount
      - programId:
          $fixture: tokenProgram
      - encoding: base64
        minContextSlot:
          $fixture: futureSlot
    expect:
      error: MinContextSlotNotReached
      message: Minimum context slot has not been reached
