name: getLatestBlockhash
status: standard
summary: Returns the latest blockhash and the last block height at which it will be valid.
params:
  - name: config
    required: false
    summary: Configuration object.
    schema:
      type: object
      properties:
        commitment: { $ref: '#/components/schemas/Commitment' }
        minContextSlot: { $ref: '#/components/schemas/Slot' }
result:
  name: blockhashInfo
  summary: Blockhash and its expiry height, in an RpcResponse envelope.
  schema:
    type: object
    required: [context, value]
    properties:
      context: { $ref: '#/components/schemas/RpcResponseContext' }
      value:
        type: object
        required: [blockhash, lastValidBlockHeight]
        properties:
          blockhash: { $ref: '#/components/schemas/Hash' }
          lastValidBlockHeight: { $ref: '#/components/schemas/U64' }
errors:
  - $ref: '#/components/errors/MinContextSlotNotReached'
examples:
  - name: basic
    summary: Default (`finalized`) commitment.
    params: []
    result:
      name: blockhashInfo
      value:
        context: { slot: 2792, apiVersion: "2.3.0" }
        value:
          blockhash: "EkSnNWid2cvwEVnVx9aBqawnmiCNiDgp3gUdkDPTKN1N"
          lastValidBlockHeight: 3090
  - name: processed-commitment
    summary: Freshest blockhash, as a sender would fetch before signing.
    params:
      - name: config
        value: { commitment: processed }
    result:
      name: blockhashInfo
      value:
        context: { slot: 2795, apiVersion: "2.3.0" }
        value:
          blockhash: "9tLdSNRmVJBqZ1qNKtQpV4nHhtSk8dW9wLGeEwjZ4iFo"
          lastValidBlockHeight: 3093
implementations:
  agave: { status: full }
  cloudbreak: { status: none }
  superbank: { status: partial, notes: "processed requires grpc-head-cache; blockhash from latest stored block" }
