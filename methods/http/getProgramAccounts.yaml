name: getProgramAccounts
status: standard
summary: Returns all accounts owned by the given program.
params:
  - name: programId
    required: true
    summary: Address of the owning program.
    schema: { $ref: '#/components/schemas/Pubkey' }
  - name: config
    required: false
    summary: Configuration object.
    schema:
      type: object
      properties:
        commitment: { $ref: '#/components/schemas/Commitment' }
        encoding: { $ref: '#/components/schemas/AccountEncoding' }
        dataSlice: { $ref: '#/components/schemas/DataSlice' }
        minContextSlot: { $ref: '#/components/schemas/Slot' }
        withContext:
          type: boolean
          description: Wrap the result in an RpcResponse context envelope. Default false.
        filters:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/GpaFilter' }
        sortResults:
          type: boolean
          description: Sort results by pubkey before returning. Default true in Agave.
result:
  name: accounts
  summary: Matching accounts, bare or context-wrapped depending on `withContext`.
  schema:
    oneOf:
      - title: WithoutContext
        description: Returned when `withContext` is absent or false.
        type: array
        items: { $ref: '#/components/schemas/RpcKeyedAccount' }
      - title: WithContext
        description: Returned when `withContext` is true.
        type: object
        required: [context, value]
        properties:
          context: { $ref: '#/components/schemas/RpcResponseContext' }
          value:
            type: array
            items: { $ref: '#/components/schemas/RpcKeyedAccount' }
errors:
  - $ref: '#/components/errors/MinContextSlotNotReached'
  - $ref: '#/components/errors/KeyExcludedFromSecondaryIndex'
  - $ref: '#/components/errors/ScanError'
  - $ref: '#/components/errors/InvalidParams'
  - $ref: '#/components/errors/InvalidRequest'
examples:
  - name: withDataSizeFilter
    summary: Two ANDed filters, default (bare array) result shape.
    params:
      - name: programId
        value: "4Nd1mBQtrMJVYVfKf2PJy9NZUZdTAsp7D4xWLs4gDB4T"
      - name: config
        value:
          encoding: base58
          filters:
            - { dataSize: 17 }
            - { memcmp: { offset: 4, bytes: "3Mc6vR" } }
    result:
      name: accounts
      value:
        - pubkey: "CxELquR1gPP8wHe33gZ4QxqGB3sZ9RSwsJ2KshVewkFY"
          account:
            lamports: 15298080
            data: ["2R9jLfiAQ9bgdcw6h8s44439", base58]
            owner: "4Nd1mBQtrMJVYVfKf2PJy9NZUZdTAsp7D4xWLs4gDB4T"
            executable: false
            rentEpoch: 28
            space: 17
  - name: withContext
    summary: "The same query with `withContext: true` returns the envelope variant."
    params:
      - name: programId
        value: "4Nd1mBQtrMJVYVfKf2PJy9NZUZdTAsp7D4xWLs4gDB4T"
      - name: config
        value: { encoding: base64, withContext: true }
    result:
      name: accounts
      value:
        context: { slot: 250000123, apiVersion: "2.3.0" }
        value:
          - pubkey: "GjwcWFQYzemBtpUoN5fMAP2FZviTtMRWCmrppGuTthJS"
            account:
              lamports: 15298080
              data: ["AQAAAB3xJyRlQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", base64]
              owner: "4Nd1mBQtrMJVYVfKf2PJy9NZUZdTAsp7D4xWLs4gDB4T"
              executable: false
              rentEpoch: 28
              space: 42
implementations:
  agave: { status: full }
  cloudbreak: { status: partial, notes: "sortResults ignored; token-program gPA restricted; minContextSlot only enforced with withContext:true" }
  superbank: { status: none }

category: Accounts
tests:
  - name: withContext-false
    params:
      - $fixture: sysvarProgram
      - encoding: base64
        filters:
          - dataSize: 40
        withContext: false
        dataSlice:
          offset: 0
          length: 0
    expect:
      shape:
        type: array
      available:
        minItems: 1
      result:
        type: array
        items:
          type: object
          required:
            - account
          properties:
            account:
              type: object
              required:
                - owner
                - data
              properties:
                owner:
                  const:
                    $fixture: sysvarProgram
                data:
                  const:
                    - ""
                    - base64
                space:
                  enum:
                    - 40
                    - null
  - name: withContext-true
    params:
      - $fixture: sysvarProgram
      - encoding: base64
        filters:
          - dataSize: 40
        withContext: true
        dataSlice:
          offset: 0
          length: 0
    expect:
      shape:
        type: object
      available:
        type: object
        required:
          - value
        properties:
          value:
            minItems: 1
      result:
        type: object
        required:
          - value
        properties:
          value:
            type: array
            items:
              type: object
              required:
                - account
              properties:
                account:
                  type: object
                  required:
                    - owner
                    - data
                  properties:
                    owner:
                      const:
                        $fixture: sysvarProgram
                    data:
                      const:
                        - ""
                        - base64
                    space:
                      enum:
                        - 40
                        - null
  - name: too-many-filters
    params:
      - $fixture: sysvarProgram
      - filters:
          - dataSize: 40
          - dataSize: 40
          - dataSize: 40
          - dataSize: 40
          - dataSize: 40
    expect:
      error: InvalidParams
  - name: missing-required-params
    params: []
    expect:
      error: InvalidParams
  - name: invalid-base58
    params:
      - not-a-base58-key!
      - encoding: base64
        filters:
          - dataSize: 40
        withContext: false
        dataSlice:
          offset: 0
          length: 0
    expect:
      error: InvalidParams
  - name: min-context-slot
    params:
      - $fixture: sysvarProgram
      - encoding: base64
        filters:
          - dataSize: 40
        withContext: false
        dataSlice:
          offset: 0
          length: 0
        minContextSlot:
          $fixture: futureSlot
    expect:
      error: MinContextSlotNotReached
      message: Minimum context slot has not been reached
  - name: min-context-slot-with-context
    params:
      - $fixture: sysvarProgram
      - encoding: base64
        filters:
          - dataSize: 40
        withContext: true
        dataSlice:
          offset: 0
          length: 0
        minContextSlot:
          $fixture: futureSlot
    expect:
      error: MinContextSlotNotReached
      message: Minimum context slot has not been reached
